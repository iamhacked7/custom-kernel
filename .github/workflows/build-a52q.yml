name: Build a52q — KSU-Next + SUSFS + Diagnostics

# Diagnostic kernel for SM-A525F (a52q / SM7125 "atoll", 4.14.190).
# KernelSU-Next with manual hook (required by susfs4ksu on non-GKI) plus
# SUSFS v1.5.5, and crucially FANOTIFY + FTRACE_SYSCALLS + KPROBES + UPROBES
# so the detection sweep can finally be observed.
#
# Toolchain and build target are taken from a workflow proven on this exact
# device tree (AlfCraft07/android_kernel_samsung_sm7125, .github/workflows/
# a52q.yml), not guessed:
#   - Proton Clang by git clone. The AOSP googlesource "+archive" tarball URL
#     does not return valid gzip and broke the first run here.
#   - Target Image.gz, not Image.gz-dtb: this defconfig sets
#     CONFIG_BUILD_ARM64_DT_OVERLAY=y (verified), so Image.gz-dtb would pull in
#     the dtbs target and fail on overlays that the bootloader applies anyway.
on:
  workflow_dispatch:
    inputs:
      ksu_source:
        description: "KernelSU-Next source"
        type: choice
        default: "susfs-ready"
        options: [susfs-ready, upstream]
      lineage_branch:
        description: "LineageOS kernel branch"
        default: "lineage-22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential curl git zip unzip rsync wget \
            libssl-dev libelf-dev libncurses5-dev ca-certificates dwarves \
            device-tree-compiler python3 ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: proton-clang-v1

      - name: Fetch Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/toolchains/clang

      - name: Verify toolchain
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Assemble kernel tree
        env:
          KSU_SOURCE: ${{ github.event.inputs.ksu_source }}
          LINEAGE_BRANCH: ${{ github.event.inputs.lineage_branch }}
        run: bash ./setup.sh "$GITHUB_WORKSPACE/a52q-kernel"

      - name: Verify integration landed
        run: |
          cd "$GITHUB_WORKSPACE/a52q-kernel"
          D=arch/arm64/configs/vendor/lineage-a52q_defconfig
          # Observability is the whole point of this build; a kernel missing
          # any of these is useless for the job it exists to do.
          for k in CONFIG_FANOTIFY CONFIG_FTRACE_SYSCALLS CONFIG_KPROBES \
                   CONFIG_KPROBE_EVENTS CONFIG_UPROBES CONFIG_UPROBE_EVENTS \
                   CONFIG_BPF_SYSCALL CONFIG_KALLSYMS_ALL \
                   CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^$k=y" "$D" || { echo "MISSING: $k"; exit 1; }
          done
          test -f fs/susfs.c || { echo "MISSING fs/susfs.c"; exit 1; }
          # fs/namespace.c references these throughout; without the declaration
          # block restored by fixups.sh the build cannot compile.
          grep -q 'DEFINE_IDA(susfs_mnt_id_ida)' fs/namespace.c || { echo "MISSING susfs decls"; exit 1; }
          grep -q 'bypass_orig_flow_clone_mnt' fs/namespace.c || { echo "MISSING clone_mnt block"; exit 1; }
          echo "semua terverifikasi"

      - name: Compile
        working-directory: a52q-kernel
        run: |
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1

          rm -rf out && mkdir -p out
          make O=out -j$(nproc) vendor/lineage-a52q_defconfig
          # Confirm the flags survived Kconfig resolution, not just the file.
          for k in CONFIG_FANOTIFY CONFIG_FTRACE_SYSCALLS CONFIG_UPROBES \
                   CONFIG_UPROBE_EVENTS CONFIG_BPF_SYSCALL CONFIG_KALLSYMS_ALL \
                   CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^$k=y" out/.config || { echo "DROPPED by Kconfig: $k"; exit 1; }
          done
          # These two MUST stay off. KSU_KPROBES_HOOK defaults to y and turns
          # itself on as soon as CONFIG_KPROBES=y, which susfs4ksu's non-GKI
          # instructions forbid; SUS_SU is unusable with kprobe hooks disabled.
          for k in CONFIG_KSU_KPROBES_HOOK CONFIG_KSU_SUSFS_SUS_SU; do
            grep -q "^# $k is not set" out/.config || { echo "MUST BE OFF: $k"; exit 1; }
          done
          echo "konfigurasi terverifikasi"

          set -o pipefail
          make O=out -j$(nproc) Image.gz 2>&1 | tee build.log || {
            echo "=== 120 baris terakhir ==="; tail -120 build.log; exit 1; }
          ls -l out/arch/arm64/boot/Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52q-KSUNext-SUSFS-diag
          path: |
            a52q-kernel/out/arch/arm64/boot/Image.gz
            a52q-kernel/out/.config
            a52q-kernel/build.log
          if-no-files-found: warn
